<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal Test</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app">
      <nav class="nav-bar">
        <div class="nav-container">
          <h1 class="nav-title">🚗 DL Test Prep - Minimal Test</h1>
        </div>
      </nav>

      <main class="main-content">
        <div class="user-info">
          <h2>Christian</h2>
          <div class="user-stats">
            <span id="userLevel">🏆 Level 1</span>
            <span id="userXP">⭐ 0 XP</span>
          </div>
        </div>

        <div class="quick-actions">
          <h3>⚡ Test Buttons</h3>
          <div class="action-grid">
            <button class="action-btn" onclick="testButton()">
              <span class="action-icon">🧠</span>
              <span class="action-text">Test Button</span>
            </button>
          </div>
        </div>

        <div
          id="console"
          style="
            background: #333;
            padding: 1rem;
            margin: 2rem 0;
            border-radius: 8px;
            color: white;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
          "
        >
          <h3>Console Output:</h3>
          <div id="consoleOutput"></div>
        </div>
      </main>
    </div>

    <script>
      function log(message) {
        const output = document.getElementById("consoleOutput");
        const line = document.createElement("div");
        line.textContent = new Date().toLocaleTimeString() + ": " + message;
        output.appendChild(line);
        console.log(message);
      }

      function testButton() {
        log("✅ Button clicked!");
        alert("Button works!");
      }

      log("🚀 Page loaded");

      // Test loading each script one by one
      const scripts = [
        "js/storage.js",
        "js/state.js",
        "js/questions.js",
        "js/game.js",
        "js/progress.js",
        "js/email.js",
        "js/ui.js",
        "js/app.js",
      ];

      let loadedScripts = 0;

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = () => {
            log(`✅ Loaded: ${src}`);
            loadedScripts++;
            resolve();
          };
          script.onerror = () => {
            log(`❌ Failed to load: ${src}`);
            reject(new Error(`Failed to load ${src}`));
          };
          document.body.appendChild(script);
        });
      }

      async function loadAllScripts() {
        try {
          for (const script of scripts) {
            await loadScript(script);
          }
          log(`✅ All ${loadedScripts} scripts loaded successfully`);

          // Test if modules are available
          log("Testing modules...");
          log("window.Storage: " + (window.Storage ? "✅" : "❌"));
          log("window.State: " + (window.State ? "✅" : "❌"));
          log("window.Questions: " + (window.Questions ? "✅" : "❌"));
          log("window.Game: " + (window.Game ? "✅" : "❌"));
          log("window.app: " + (window.app ? "✅" : "❌"));
        } catch (error) {
          log("❌ Error loading scripts: " + error.message);
        }
      }

      // Load scripts after DOM is ready
      document.addEventListener("DOMContentLoaded", () => {
        log("📄 DOM loaded, loading scripts...");
        loadAllScripts();
      });
    </script>
  </body>
</html>
