<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug Test - DL Test Prep</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div style="padding: 2rem; max-width: 800px; margin: 0 auto">
      <h1>🧪 Debug Test Page</h1>

      <div style="margin: 2rem 0">
        <h2>Current State:</h2>
        <div
          id="currentState"
          style="
            background: var(--surface);
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
          "
        ></div>
      </div>

      <div style="margin: 2rem 0">
        <h2>Test Actions:</h2>
        <button
          onclick="testAnswer(true)"
          style="
            margin: 0.5rem;
            padding: 1rem;
            background: green;
            color: white;
            border: none;
            border-radius: 8px;
          "
        >
          ✅ Answer Correct
        </button>
        <button
          onclick="testAnswer(false)"
          style="
            margin: 0.5rem;
            padding: 1rem;
            background: red;
            color: white;
            border: none;
            border-radius: 8px;
          "
        >
          ❌ Answer Wrong
        </button>
        <button
          onclick="showCurrentState()"
          style="
            margin: 0.5rem;
            padding: 1rem;
            background: blue;
            color: white;
            border: none;
            border-radius: 8px;
          "
        >
          🔍 Show State
        </button>
        <button
          onclick="resetState()"
          style="
            margin: 0.5rem;
            padding: 1rem;
            background: orange;
            color: white;
            border: none;
            border-radius: 8px;
          "
        >
          🔄 Reset
        </button>
      </div>

      <div style="margin: 2rem 0">
        <h2>UI Elements Test:</h2>
        <div
          style="background: var(--surface); padding: 1rem; border-radius: 8px"
        >
          <div>XP: <span id="userXP">⭐ 0 XP</span></div>
          <div>Level: <span id="userLevel">🏆 Level 1</span></div>
          <div>Total Questions: <span id="totalQuestions">0</span></div>
          <div>Accuracy: <span id="overallAccuracy">0%</span></div>
          <div>Streak: <span id="currentStreak">0 days 🔥</span></div>
        </div>
      </div>
    </div>

    <!-- Load all the app scripts -->
    <script src="js/storage.js"></script>
    <script src="js/state.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/game.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/email.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

    <script>
      // Initialize the app
      window.addEventListener("DOMContentLoaded", async () => {
        console.log("🚀 Initializing debug test...");

        if (window.Storage) await window.Storage.init();
        if (window.State) window.State.init();
        if (window.Questions) await window.Questions.loadQuestions();

        showCurrentState();
      });

      function testAnswer(correct) {
        console.log(
          `🧪 Testing ${correct ? "correct" : "incorrect"} answer...`
        );

        if (window.State) {
          window.State.answerQuestion(correct, "traffic-signs");
          updateUI();
          showCurrentState();
        } else {
          console.error("❌ State not available!");
        }
      }

      function updateUI() {
        console.log("🎨 Updating UI...");

        const userData = window.State?.getUserData();
        if (!userData) {
          console.error("❌ No user data available!");
          return;
        }

        const userXP = document.getElementById("userXP");
        const userLevel = document.getElementById("userLevel");
        const totalQuestions = document.getElementById("totalQuestions");
        const overallAccuracy = document.getElementById("overallAccuracy");
        const currentStreak = document.getElementById("currentStreak");

        if (userXP) userXP.textContent = `⭐ ${userData.xp} XP`;
        if (userLevel) userLevel.textContent = `🏆 Level ${userData.level}`;
        if (totalQuestions)
          totalQuestions.textContent = userData.totalQuestions.toString();
        if (currentStreak)
          currentStreak.textContent = `${userData.streak} days 🔥`;

        if (overallAccuracy) {
          const accuracy =
            userData.totalQuestions > 0
              ? Math.round(
                  (userData.correctAnswers / userData.totalQuestions) * 100
                )
              : 0;
          overallAccuracy.textContent = `${accuracy}%`;
        }
      }

      function showCurrentState() {
        const userData = window.State?.getUserData();
        const progress = window.State?.getProgress();

        const stateDiv = document.getElementById("currentState");
        stateDiv.innerHTML = `
                <strong>User Data:</strong><br>
                Total Questions: ${userData?.totalQuestions || 0}<br>
                Correct Answers: ${userData?.correctAnswers || 0}<br>
                XP: ${userData?.xp || 0}<br>
                Level: ${userData?.level || 1}<br>
                Streak: ${userData?.streak || 0}<br>
                <br>
                <strong>Progress:</strong><br>
                Weak Areas: ${progress?.weakAreas?.length || 0}<br>
                Mastered Topics: ${progress?.masteredTopics?.length || 0}<br>
                Categories: ${
                  Object.keys(progress?.categories || {}).length
                }<br>
            `;
      }

      function resetState() {
        if (window.State) {
          window.State.resetProgress();
          updateUI();
          showCurrentState();
          console.log("🔄 State reset!");
        }
      }
    </script>
  </body>
</html>
