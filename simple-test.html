<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Test - DL Test Prep</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app">
      <nav class="nav-bar">
        <div class="nav-container">
          <h1 class="nav-title">🚗 DL Test Prep</h1>
        </div>
      </nav>

      <main class="main-content">
        <div class="user-info">
          <div class="user-avatar">🎯</div>
          <h2>Christian</h2>
          <div class="user-stats">
            <span id="userLevel">🏆 Level 1</span>
            <span id="userXP">⭐ 0 XP</span>
          </div>
        </div>

        <div class="quick-actions">
          <h3>⚡ Quick Actions</h3>
          <div class="action-grid">
            <button class="action-btn" onclick="testFunction()">
              <span class="action-icon">🧠</span>
              <span class="action-text">Test Button</span>
            </button>
          </div>
        </div>
      </main>
    </div>

    <script>
      console.log("🚀 Simple test loaded");

      function testFunction() {
        alert("Button works!");
        console.log("Button clicked");
      }

      // Test if CSS is working
      document.addEventListener("DOMContentLoaded", () => {
        console.log("DOM loaded");
        const userXP = document.getElementById("userXP");
        if (userXP) {
          console.log("✅ Found userXP element");
          setTimeout(() => {
            userXP.textContent = "⭐ 999 XP";
            console.log("✅ Updated XP display");
          }, 1000);
        } else {
          console.error("❌ userXP element not found");
        }
      });
    </script>
  </body>
</html>
