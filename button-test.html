<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Test</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div style="padding: 2rem; color: white">
      <h1>🧪 Button Test</h1>

      <div style="margin: 2rem 0">
        <h2>Basic Buttons:</h2>
        <button
          onclick="alert('Basic button works!')"
          style="
            padding: 1rem;
            margin: 0.5rem;
            background: green;
            color: white;
            border: none;
            border-radius: 8px;
          "
        >
          ✅ Basic Test
        </button>
        <button
          onclick="testApp()"
          style="
            padding: 1rem;
            margin: 0.5rem;
            background: blue;
            color: white;
            border: none;
            border-radius: 8px;
          "
        >
          🚀 Test App
        </button>
      </div>

      <div style="margin: 2rem 0">
        <h2>App Buttons (from main app):</h2>
        <button class="action-btn" id="studyModeBtn">
          <span class="action-icon">🧠</span>
          <span class="action-text">Study Mode</span>
        </button>
        <button class="action-btn" id="mockTestBtn">
          <span class="action-icon">⚡</span>
          <span class="action-text">Mock Test</span>
        </button>
      </div>

      <div
        id="status"
        style="
          background: #333;
          padding: 1rem;
          margin: 2rem 0;
          border-radius: 8px;
        "
      >
        <h3>Status:</h3>
        <div>App initialized: <span id="appStatus">❌</span></div>
        <div>Event listeners: <span id="eventStatus">❌</span></div>
      </div>
    </div>

    <!-- Load app scripts -->
    <script src="js/storage.js"></script>
    <script src="js/state.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/game.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/email.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

    <script>
      function testApp() {
        console.log("🧪 Testing app...");
        console.log("window.app:", window.app);
        console.log("window.State:", window.State);
        console.log("window.Questions:", window.Questions);

        if (window.app) {
          document.getElementById("appStatus").textContent = "✅";
          console.log("✅ App is available");
        } else {
          document.getElementById("appStatus").textContent = "❌";
          console.error("❌ App is not available");
        }

        // Test if event listeners are working
        const studyBtn = document.getElementById("studyModeBtn");
        if (studyBtn && studyBtn.onclick) {
          document.getElementById("eventStatus").textContent = "✅";
          console.log("✅ Event listeners are set");
        } else {
          document.getElementById("eventStatus").textContent = "❌";
          console.error("❌ Event listeners not set");
        }
      }

      // Initialize when DOM loads
      document.addEventListener("DOMContentLoaded", async () => {
        console.log("🚀 DOM loaded, initializing...");

        try {
          // Initialize app
          if (window.app) {
            await window.app.init();
            console.log("✅ App initialized");
          } else {
            console.error("❌ window.app not found");
          }

          // Test after a delay
          setTimeout(testApp, 1000);
        } catch (error) {
          console.error("❌ Initialization failed:", error);
        }
      });
    </script>
  </body>
</html>
